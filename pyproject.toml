[project]
name = "graphist-zotero-mcp"
dynamic = ["version"]
description = "MCP server to search, read, annotate and edit a Zotero library through the Zotero Web API, with full text, OCR and citation checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "graph-ist" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "zotero", "bibliography", "pdf", "annotations", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# PyMuPDF is AGPL-3.0: see the Licence section of the README.
dependencies = ["mcp[cli]>=1.2.0,<2", "httpx>=0.27", "pymupdf>=1.24", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/graph-ist/zotero-mcp"
Issues = "https://github.com/graph-ist/zotero-mcp/issues"
Changelog = "https://github.com/graph-ist/zotero-mcp/blob/main/CHANGELOG.md"

[project.scripts]
graphist-zotero-mcp = "zotero_mcp.transport:main"
graphist-zotero-snapshot = "zotero_mcp.snapshot:main"
graphist-zotero-ocr = "zotero_mcp.ocr_worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "zotero_mcp/config.py"

[tool.hatch.build.targets.wheel]
packages = ["zotero_mcp"]

[tool.hatch.build.targets.sdist]
include = ["zotero_mcp/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8"]
